  <section id="video" class="pt-20 pb-50">
    <h2 class="my-1 mx-0 justify-center items-center flex font-medium text-5xl [-webkit-text-stroke:0.2px_black] font-bodoni italic text-pink-600 pb-3">Random video</h2>
    <section class="grid justify-center">
        <div class="video">
            <iframe
                width="1280"
                height="720"
                [src]="videoUrl"
                referrerpolicy="strict-origin-when-cross-origin"
                title="Love Live video"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </section>
  </section>
