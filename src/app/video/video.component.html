<section class="grid justify-center">
    <div class="video">
        <iframe
            width="1280"
            height="720"
            [src]="videoUrl"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Love Live video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
</section>
